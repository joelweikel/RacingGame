<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MMORP Racer</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      margin: 0;
      height: 100dvh;
      background: #fff;
      color: #141416;
      font: 14px/1.5 system-ui, sans-serif;
    }
    #viewport { position: relative; overflow: hidden; width: 100%; height: 100%; }
    canvas { display: block; outline: none; }
    #status {
      position: absolute;
      z-index: 1;
      inset: 0;
      margin: 0;
      place-content: center;
      text-align: center;
      background: #fff;
    }
    #status:not([hidden]) { display: grid; }
    #status strong { font-size: clamp(2.5rem, 8vw, 6rem); font-style: italic; line-height: 1.07; }
    #loadMessage { color: #124fb8; }
    #audioCredits {
      position: absolute;
      bottom: 0.6rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.16rem 0.55rem;
      border-radius: 0.65rem;
      color: #fff;
      background: #141416;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main id="viewport">
    <div id="status" role="status">
      <strong>MMORP RACER</strong>
      <span id="loadMessage">Loading…</span>
    </div>
    <canvas id="canvas" tabindex="0" aria-label="MMORP Racer"></canvas>
    <a id="audioCredits" href="audio-credits.txt" target="_blank" rel="noopener" hidden>Audio credits</a>
  </main>
  <script>
    const canvas = document.getElementById('canvas');
    const statusElement = document.getElementById('status');
    const loadMessage = document.getElementById('loadMessage');
    let errorMessage = '';
    canvas.addEventListener('pointerdown', () => canvas.focus());
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    function unlockKeyboardAudio(event) {
      // miniaudio registers click/touch unlock handlers. Keyboard-only players also
      // need a trusted DOM gesture to resume the Web Audio context.
      if (event.isTrusted && window.miniaudio?.devices?.length) {
        window.miniaudio.unlock();
        window.removeEventListener('keydown', unlockKeyboardAudio, true);
      }
    }
    window.addEventListener('keydown', unlockKeyboardAudio, true);
    var Module = {
      canvas,
      printErr(message) {
        if (!message) return;
        console.error(message);
        errorMessage = message;
        Module.setStatus(message);
      },
      setStatus(message) {
        const text = errorMessage || message;
        loadMessage.textContent = text;
        statusElement.hidden = !text;
      },
      onRuntimeInitialized() {
        Module.setStatus('');
        document.getElementById('audioCredits').hidden = false;
        canvas.focus({ preventScroll: true });
      },
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
